name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Version files agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check VERSION, the Android build and (for a release) the tag
        run: node scripts/version.mjs check "${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}"

  web:
    name: Single-file build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - name: Build the single HTML file
        run: ./scripts/single_file_package.sh
      - name: Check the build is one self-contained file
        run: |
          test "$(ls construction_calc_v*.html | wc -l)" = 1
          ! grep -E '<script[^>]+src=|<link[^>]+href=' construction_calc_v*.html
      - run: cp construction_calc_v*.html "$RUNNER_TEMP/construction_calc.html"
      - uses: actions/upload-artifact@v4
        with:
          name: construction-calc-html
          path: ${{ runner.temp }}/construction_calc.html
          if-no-files-found: error

  android:
    name: Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build APK (Gradle builds the web page the app bundles)
        run: ./gradlew :app:assembleDebug --no-daemon
        working-directory: Android
      - run: cp Android/app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/construction-calc-debug.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: construction-calc-apk
          path: ${{ runner.temp }}/construction-calc-debug.apk
          if-no-files-found: error

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, web, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          mv artifacts/construction_calc.html "construction-calc-$TAG.html"
          mv artifacts/construction-calc-debug.apk "construction-calc-$TAG-debug.apk"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "Construction Calc $TAG" --generate-notes \
            "construction-calc-$TAG.html#Construction Calc (single HTML file)" \
            "construction-calc-$TAG-debug.apk#Construction Calc (Android debug APK)"
